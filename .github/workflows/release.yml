# Publishes a signed APK as a GitHub Release. Runs only for a version tag (v1.2.3) that points at a commit on
# main; a tag on anything else (a feature branch, a fork's commit) fails before anything is built.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The signing secrets live in this environment; it can require an approval before the job starts.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main. Releases are published from main only."
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test --no-configuration-cache

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PANELGLASS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The release signing key is not configured; refusing to publish an unsigned APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          PANELGLASS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          PANELGLASS_KEYSTORE_PASSWORD: ${{ secrets.PANELGLASS_KEYSTORE_PASSWORD }}
          PANELGLASS_KEY_ALIAS: ${{ secrets.PANELGLASS_KEY_ALIAS }}
          PANELGLASS_KEY_PASSWORD: ${{ secrets.PANELGLASS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName="$VERSION" --no-configuration-cache

      - name: Verify the signature and checksum
        run: |
          APK="app/build/outputs/apk/release/panelglass-$VERSION-release.apk"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          mkdir -p dist
          cp "$APK" "dist/panelglass-$VERSION.apk"
          (cd dist && sha256sum "panelglass-$VERSION.apk" > "panelglass-$VERSION.apk.sha256")

      # The notes are the version's section of CHANGELOG.md ("## [1.2.0] - date" up to the next "## ["); a version
      # without one gets GitHub's generated list of merged pull requests instead.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v head="## [$VERSION]" '
            /^## \[/ { p = (index($0, head) == 1); next }
            p
          ' CHANGELOG.md > dist/notes.md
          if grep -q '[^[:space:]]' dist/notes.md; then
            NOTES=(--notes-file dist/notes.md)
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION; using generated notes."
            NOTES=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/panelglass-$VERSION.apk" "dist/panelglass-$VERSION.apk.sha256" \
            --title "Panelglass – Manga Translator for Android $GITHUB_REF_NAME" "${NOTES[@]}" --verify-tag

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
